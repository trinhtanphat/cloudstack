# VNSO CloudStack — example management server location blocks
#
# Apply rate-limits to the API and login endpoints. Drop into your existing
# `server { listen 443 ssl http2; server_name manage.example.vn; ... }` block.

location = /client/api {
    limit_req  zone=vnso_api  burst=60   nodelay;
    limit_conn vnso_conn 50;
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
}

location = /client/api/login {
    limit_req  zone=vnso_login burst=10  nodelay;
    limit_conn vnso_conn 5;
    proxy_pass http://127.0.0.1:8080;
}

location /client/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

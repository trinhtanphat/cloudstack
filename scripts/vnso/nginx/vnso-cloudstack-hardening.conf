# VNSO CloudStack — Nginx hardening snippet
#
# Drop-in additions on top of the existing nginx.conf:
#   * Rate-limiting for /client/api (mitigates credential stuffing & DoS).
#   * Connection limits per client IP.
#   * Tighter HSTS, Permissions-Policy, COOP/CORP for the management UI.
#
# Usage: include this file from inside the http { } block, then reference
#        the named zones in the relevant server { } / location { } blocks.
#
#   include /etc/nginx/conf.d/vnso-cloudstack-hardening.conf;
#
# Tested with nginx 1.22+ on Debian/Ubuntu.

# ---------- Rate-limit zones (http context) ----------
limit_req_zone $binary_remote_addr zone=vnso_api:10m   rate=30r/s;
limit_req_zone $binary_remote_addr zone=vnso_login:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=vnso_conn:10m;

# ---------- Common security headers (server context) ----------
# Add this to the management server { } block:
#
#   include /etc/nginx/conf.d/vnso-cloudstack-headers.inc;

# (Headers go in a separate include so server-level add_header is inherited.)

services:
  # CloudStack Management Server
  cloudstack-mgmt:
    build:
      context: .
      dockerfile: Dockerfile.runtime
    image: cloudstack-mgmt-runtime:local
    container_name: cloudstack-mgmt
    restart: unless-stopped
    stop_grace_period: 60s
    working_dir: /opt/cloudstack
    # Wait until the external MySQL (xiaozhi-esp32-server-db on xiaozhi-net) accepts
    # TCP connections AND answers SELECT 1 before launching the Java daemon.
    # This avoids the well-known HTTP 503 on /client/ that happens when the JDBC
    # pool is initialized while MySQL is still running InnoDB / XA recovery.
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - |
        set -e
        DB_HOST="${DB_HOST:-xiaozhi-esp32-server-db}"
        DB_PORT="${DB_PORT:-3306}"
        echo "[entrypoint] Waiting for ${DB_HOST}:${DB_PORT} ..."
        for i in $(seq 1 90); do
          if (exec 3<>/dev/tcp/${DB_HOST}/${DB_PORT}) 2>/dev/null; then
            exec 3>&-; echo "[entrypoint] TCP ready (try ${i})"; break
          fi
          sleep 2
        done
        # Optional MySQL handshake check (skip if client missing or auth not ready)
        if command -v mysql >/dev/null 2>&1; then
          for i in $(seq 1 60); do
            if mysql -h "${DB_HOST}" -P "${DB_PORT}" -u"${DB_USER:-cloud}" -p"${DB_PASS:-cloud}" -e "SELECT 1" >/dev/null 2>&1; then
              echo "[entrypoint] MySQL handshake OK (try ${i})"; break
            fi
            sleep 2
          done
        fi
        echo "[entrypoint] Starting CloudStack management server"
        exec java -cp /opt/cloudstack/cloud-client-ui.jar:/opt/cloudstack/lib/* org.apache.cloudstack.ServerDaemon
    environment:
      TZ: "Asia/Ho_Chi_Minh"
      JAVA_TOOL_OPTIONS: "--add-opens=java.base/java.lang=ALL-UNNAMED -Xms512m -Xmx2048m -Dlog4j.configurationFile=/opt/cloudstack/conf/log4j-cloud.xml"
      DB_HOST: "xiaozhi-esp32-server-db"
      DB_PORT: "3306"
      DB_USER: "cloud"
      DB_PASS: "cloud"
    ports:
      - "0.0.0.0:28080:28080"
      - "0.0.0.0:8250:8250"
    volumes:
      - ./client/target/cloud-client-ui-4.23.0.0-SNAPSHOT.jar:/opt/cloudstack/cloud-client-ui.jar:ro
      - ./client/target/lib:/opt/cloudstack/lib:ro
      - ./docker/conf:/opt/cloudstack/conf:ro
      - ./docker/conf/commands.properties:/opt/cloudstack/commands.properties:ro
      - ./scripts:/opt/cloudstack/scripts:ro
      - ./engine/schema/dist/systemvm-templates:/opt/cloudstack/engine/schema/dist/systemvm-templates:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Probe the actual /client/ endpoint (which exercises the DB pool) instead of
    # a bare TCP socket — Jetty binds 28080 long before the webapp can serve 200.
    healthcheck:
      test:
        - "CMD-SHELL"
        - |
          code=$$(curl -sS -o /dev/null -w '%{http_code}' --max-time 8 http://127.0.0.1:28080/client/ 2>/dev/null || echo 000)
          [ "$$code" = "200" ] || [ "$$code" = "302" ] || [ "$$code" = "401" ]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 180s
    networks:
      - xiaozhi-net

networks:
  xiaozhi-net:
    external: true

<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'" />
<title>VNSO CloudStack — Setup</title>
<style>
  body { margin:0; background:#0b1220; color:#e6edf7; font: 14px/1.5 system-ui, sans-serif; }
  @media (prefers-color-scheme: light) { body { background:#fff; color:#0f172a; } input, button { color:#0f172a; } }
  main { max-width: 480px; margin: 12vh auto; padding: 28px; background: rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.08); border-radius: 14px; }
  h1 { margin-top:0; font-size: 1.4rem; }
  label { display:block; margin-top: 14px; }
  input { width:100%; padding:10px 12px; margin-top:4px; background: transparent; color: inherit; border:1px solid rgba(127,127,127,.4); border-radius:8px; }
  button { margin-top: 18px; padding: 11px 18px; border:none; border-radius:8px; background:#0f766e; color:#fff; font-weight:600; cursor:pointer; }
  .err { color:#fca5a5; margin-top:8px; min-height: 18px; }
</style>
</head>
<body>
<main>
  <h1>VNSO CloudStack — Desktop</h1>
  <p>Nhập URL management server. Phiên đăng nhập diễn ra bên trong CloudStack UI.</p>
  <label>Management URL <input id="url" type="url" placeholder="https://manage.example.vn" /></label>
  <button id="go">Mở Console</button>
  <div class="err" id="err"></div>
</main>
<script>
  (async () => {
    document.getElementById('url').value = (await window.vnso.getUrl()) || '';
    document.getElementById('go').addEventListener('click', async () => {
      const v = document.getElementById('url').value.trim().replace(/\/$/, '');
      if (!/^https?:\/\//.test(v)) { document.getElementById('err').textContent = 'URL phải bắt đầu bằng http(s)://'; return; }
      await window.vnso.setUrl(v);
    });
  })();
</script>
</body>
</html>
